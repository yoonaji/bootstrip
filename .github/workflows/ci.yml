# 빌드·테스트와 의존성 취약점 검사. 모든 PR과 main 푸시에서 돈다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: 복원
        run: dotnet restore BootDiet.slnx
      - name: 빌드
        run: dotnet build BootDiet.slnx --no-restore -c Release
      - name: 테스트
        run: dotnet test BootDiet.slnx --no-build -c Release --logger "console;verbosity=normal"
      - name: 의존성 취약점 검사
        shell: pwsh
        run: |
          $out = dotnet list BootDiet.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match '(?m)^\s*>\s') { Write-Error '취약한 NuGet 패키지가 있습니다.'; exit 1 }
